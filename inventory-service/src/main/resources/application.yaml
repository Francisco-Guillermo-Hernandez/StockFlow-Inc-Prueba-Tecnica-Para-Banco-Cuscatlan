server:
  port: ${SERVER_PORT:3030}
#  servlet:
#      context-path: /api/v1


spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: Prueba-tecnica
    version: 1.0

  # configuracion para la base H2
  datasource:
    url: jdbc:h2:mem:mydb
    username: sa
    password: password
    driver-class-name: org.h2.Driver

    # Configuracion
    hikari:
      minimum-idle: 5 #numero minimo de conexiones inactivas mantenidas en el pool de conexiones de HikariCP
      connection-timeout: 60000 #cantidad de milisegundos que el cliente espera por la conexion a la bd 20000
      maximum-pool-size: 10 #numero de conexiones maximas usadas en el pool de conexiones
      idle-timeout: 60000  #tiempo maximo de inactividad para la conexion 20000
      max-lifetime: 1000 #tiempo de vida maximo en milisegundos de la conexion del pool de conexiones despues de que se cierre 10000
      pool-name: ${spring.application.name}

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop # manejo del esquema
    show-sql: true #
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  h2:
    console:
      enabled: true

customMessages:
  invalidRequest:
    code: 400
    message: Peticion invalida

  notFound:
    code: 404
    message: No Encontrado

  serverError:
    code: 500
    message: Error en el servidor


